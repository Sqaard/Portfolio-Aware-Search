[project]
name = "finportfolio-ir"
version = "0.1.0"
description = "Portfolio-aware financial document retrieval for FinGPT feature extraction."
requires-python = ">=3.9"
dependencies = [
  "pyyaml",
]

# Optional Big Data layer (bigdata/). The core IR pipeline and the portable
# local MapReduce engine need none of this; install only to use engine=spark:
#   pip install -e ".[bigdata]"    (or: pip install -r requirements-bigdata.txt)
[project.optional-dependencies]
bigdata = [
  "pyspark>=3.5,<4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
