# Standalone Apache Spark cluster (1 master + 2 workers) for the FinPortfolio IR
# Big Data layer. This turns the "engine=spark" path into a genuinely
# distributed, multi-node deployment: jobs submitted here run their map/reduce
# stages across the two worker containers.
#
# Bring up:   docker compose -f deploy/spark_cluster/docker-compose.yml up -d
# Master UI:  http://localhost:8080   (watch workers register + jobs run)
# Submit:     deploy/spark_cluster/submit.sh <module> [args...]
# Tear down:  docker compose -f deploy/spark_cluster/docker-compose.yml down
#
# Image note: the Docker *official* Spark image (with Python 3) is used —
# bitnami/spark was removed from Docker Hub by Broadcom in 2025. The official
# image has no SPARK_MODE entrypoint, so master/worker are started explicitly
# via spark-class.
#
# The repository is bind-mounted read-write at /workspace on every node, so the
# jobs (bigdata/, finportfolio_ir/) are importable by driver and executors and
# artifacts land back in data/exports/bigdata on the host.

x-spark-env: &spark-env
  # /workspace first so bigdata/finportfolio_ir import; Spark's own python dirs
  # must stay on the path (a bare PYTHONPATH=/workspace would shadow pyspark).
  PYTHONPATH: /workspace:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
  PYSPARK_PYTHON: /usr/bin/python3
  PYSPARK_DRIVER_PYTHON: /usr/bin/python3
  # Turning this on makes every job write an event log, which the History Server
  # (http://localhost:18080) replays after the app exits: DAG, per-task Event
  # Timeline, shuffle read/write, executor metrics.
  FINPORTFOLIO_SPARK_EVENTLOG_DIR: /workspace/data/spark-events

x-spark-common: &spark-common
  image: spark:3.5.3-scala2.12-java17-python3-ubuntu
  volumes:
    - ../../:/workspace
    # Optional second mount for data kept outside the repo -- benchmark corpora
    # live on an ASCII path because Hadoop's local reader hangs on the project's
    # Cyrillic directory. Harmless when FINPORTFOLIO_EXTRA_DIR is unset: it then
    # mounts the repo's own exports directory, which is already visible.
    - ${FINPORTFOLIO_EXTRA_DIR:-../../data/exports}:/extra
  working_dir: /workspace

services:
  spark-master:
    <<: *spark-common
    container_name: finportfolio-spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      <<: *spark-env
      SPARK_LOCAL_IP: spark-master
    ports:
      - "8080:8080"   # master web UI
      - "7077:7077"   # cluster RPC endpoint
      - "4040:4040"   # driver UI (when a job runs from the master container)

  spark-worker-1:
    <<: *spark-common
    container_name: finportfolio-spark-worker-1
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 2g
      - --webui-port
      - "8081"
    environment:
      <<: *spark-env
      SPARK_LOCAL_IP: spark-worker-1
    ports:
      - "8081:8081"

  spark-worker-2:
    <<: *spark-common
    container_name: finportfolio-spark-worker-2
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 2g
      - --webui-port
      - "8081"
    environment:
      <<: *spark-env
      SPARK_LOCAL_IP: spark-worker-2
    ports:
      - "8082:8081"

  spark-history:
    <<: *spark-common
    container_name: finportfolio-spark-history
    depends_on:
      - spark-master
    # The log dir is gitignored, so on a fresh clone it does not exist yet and the
    # History Server would exit at startup (before any job creates it). Create it
    # first so `compose up` -> http://localhost:18080 works on a clean checkout.
    command:
      - /bin/sh
      - -c
      - >-
        mkdir -p /workspace/data/spark-events &&
        exec /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
    environment:
      <<: *spark-env
      SPARK_LOCAL_IP: spark-history
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=file:/workspace/data/spark-events
        -Dspark.history.ui.port=18080
        -Dspark.history.fs.update.interval=5s
    ports:
      - "18080:18080"   # History Server: finished jobs stay inspectable here
